# Сторож датасета русских названий: смотрит и на возраст выпуска, и на его содержимое.
#
# ЗАЧЕМ. Сборка датасета живёт в foulnike/animori-data и идёт по расписанию.
# Расписание у GitHub отключается после 60 дней без человеческой активности
# в репозитории, и отключается молча: ни письма, ни ошибки, ни красного
# крестика — выпуски просто перестают появляться. Личный токен лечит
# ровно эту одну причину и сам протухает точно так же тихо.
#
# Поэтому смотрим не на причину, а на следствие.
#
# ТРИ ВОПРОСА, А НЕ ОДИН. Сначала здесь был один: сколько дней выпуску.
# Этого мало, и слепая зона вскрылась на живом примере. Прежний источник
# умирал не отказом, а замиранием: архив всё так же читался, файлы
# всё так же скачивались, сборка всё так же выпускала свежий выпуск каждый
# понедельник — а новые тайтлы в него больше не попадали. Сторож при этом
# молчал бы годами: возраст выпуска всегда в норме.
#
# Поэтому второй вопрос: совпадает ли старший номер в выпуске с тем,
# что сегодня отдаёт живой каталог Шикимори. Ответ на него ловит то,
# что возраст не ловит никогда: замерзший источник, тихо сменившийся отбор,
# обход, оборвавшийся на середине без ошибки.
#
# Третий вопрос завёлся в сентябре 2026, когда AniList закрыл сторонний
# доступ к API. Карта MAL — AniList с тех пор наследуется из прошлого выпуска,
# когда волна не дошла: вчерашняя карта лучше пустой. Но унаследованная карта
# неотличима от свежей ни числом пар, ни размером файла — то же замирание,
# только уже внутри исправного выпуска. Поэтому сборщик пишет возраст карты
# в опись, а сторож спрашивает про него отдельно.
#
# ПРО МЕСТО. Прогон лежит здесь, а не в animori-data, по двум причинам.
# Первая: сторож в том же репозитории уснул бы вместе с тем, за чем следит.
# Здесь коммиты идут руками постоянно, и его собственное расписание живёт.
# Вторая: встроенный токен умеет читать выпуски чужого публичного репозитория
# и заводить задачи в своём — задача в соседнем потребовала бы личного токена,
# то есть того самого, от чего мы уходим.
#
# ПРО ВЕТКУ. Расписание работает только из ветки по умолчанию, а она тут main.
# Файл обязан лежать именно в main, иначе проверки не будет вовсе.
# Копию в рабочей ветке надо держать точно такой же: иначе слияние откатит
# правку обратно и тоже молча.
#
# ЧТО ДЕЛАТЬ ПО ПИСЬМУ. Открыть animori-data, Actions -> build-names -> Run workflow.
# Ручной запуск сам по себе считается человеческой активностью и заводит
# отсчёт шестидесяти дней заново. Если расписание успело заснуть, GitHub
# покажет там же кнопку включения — больше ничего не требуется.

name: watch-dataset

on:
  # Раз в сутки. Частее незачем: выпуск и так недельный.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Сторожу нужны только задачи. Код он даже не забирает.
permissions:
  issues: write

concurrency:
  group: watch-dataset
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Возраст выпуска
        id: age
        env:
          GH_TOKEN: ${{ github.token }}
          # Сколько дней молчания считаем нормой. Выпуск недельный,
          # так что десять — это один пропущенный понедельник и три дня запаса
          # на очередь задач и повторный прогон.
          LIMIT_DAYS: '10'
        run: |
          set -euo pipefail

          # Отказ чтения не роняет шаг: отсутствие выпуска — тоже повод
          # для письма, а не причина молча упасть самому.
          gh api repos/foulnike/animori-data/releases/latest > release.json 2>/dev/null || echo '{}' > release.json

          published="$(jq -r '.published_at // empty' release.json)"
          tag="$(jq -r '.tag_name // empty' release.json)"

          if [ -z "$published" ]; then
            echo 'Выпусков нет или выпуски не читаются'
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo 'days=неизвестно' >> "$GITHUB_OUTPUT"
            echo 'tag=ни одного выпуска не найдено' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          days=$(( ( $(date -u +%s) - $(date -u -d "$published" +%s) ) / 86400 ))
          echo "Выпуск $tag от $published, возраст $days дн."

          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"

          if [ "$days" -gt "$LIMIT_DAYS" ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stale=false' >> "$GITHUB_OUTPUT"
          fi

      # Второй вопрос: свежее ли содержимое, а не только сам выпуск.
      #
      # Опись берётся с постоянного адреса releases/latest/download — того самого,
      # куда ходит клиент. Значит сторож видит ровно то, что видят люди,
      # а не содержимое черновика или артефакта.
      - name: Свежесть содержимого
        id: fresh
        env:
          # На сколько номеров выпуску разрешено отставать от живого каталога.
          #
          # Число взято с запасом и подлежит уточнению после первых недель
          # наблюдений: Шикимори выдаёт номера неравномерно, а перед сезоном
          # заводит анонсы пачками. Смысл проверки не в точном слежении,
          # а в ловле замирания: при замёрзшей сборке отставание растёт
          # без остановки и любой порог пробьёт само.
          LAG_LIMIT: '400'
          # Пол по числу названий в выпуске. Тот же, что у приёмки сборки:
          # если выпуск всё же вышел похудевшим, приёмка была обойдена руками.
          COUNT_FLOOR: '25000'
          UA: 'AniMori/3.0 (+https://github.com/foulnike/AniMori-AniList-Toolkit)'
        run: |
          set -euo pipefail

          curl -fsSL --max-time 30 -o index.json \
            https://github.com/foulnike/animori-data/releases/latest/download/index.json \
            2>/dev/null || echo '{}' > index.json

          have="$(jq -r '.freshness.maxId // empty' index.json 2>/dev/null || true)"
          count="$(jq -r '.names.count // empty' index.json 2>/dev/null || true)"
          source="$(jq -r '.source // empty' index.json 2>/dev/null || true)"

          echo "В описи: источник ${source:-нет}, названий ${count:-нет}, старший номер ${have:-нет}"

          # Зеркала по порядку надёжности по замерам. shikimori.one в список
          # не взят намеренно: он отвечал таймаутом в половине проб.
          #
          # censored=false обязательно: без него каталог обрезан на шесть тысяч
          # записей и старший номер приходит другой. Сборщик ходит с ним,
          # и сравнивать обязаны одно с тем же — иначе сторож будет врать каждый день.
          live=''
          used=''
          for host in shikimori.rip shikimori.io; do
            body="$(curl -fsSL --max-time 30 -H "user-agent: $UA" -H 'accept: application/json' \
              "https://$host/api/animes?page=1&limit=1&order=id_desc&censored=false" 2>/dev/null || true)"
            live="$(printf '%s' "$body" | jq -r '.[0].id // empty' 2>/dev/null || true)"
            if [ -n "$live" ]; then
              used="$host"
              break
            fi
            echo "$host не ответил, пробуем следующий"
          done

          echo "Живой каталог: старший номер ${live:-нет} с ${used:-ни одного адреса}"

          echo "have=${have:-нет}" >> "$GITHUB_OUTPUT"
          echo "live=${live:-нет}" >> "$GITHUB_OUTPUT"
          echo "count=${count:-нет}" >> "$GITHUB_OUTPUT"
          echo "mirror=${used:-нет}" >> "$GITHUB_OUTPUT"

          # Нет одного из двух чисел — молчим. Сторож врать не должен ни в какую
          # сторону: чужой таймаут — не повод будить человека. Заодно это держит
          # сторожа тихим на выпусках старого формата, где блока freshness нет вовсе:
          # проверка сама оживёт после первого же выпуска новой сборки.
          if [ -z "$have" ] || [ -z "$live" ]; then
            echo 'Сравнивать нечего, проверка свежести пропущена'
            echo 'stale=unknown' >> "$GITHUB_OUTPUT"
            echo 'lag=неизвестно' >> "$GITHUB_OUTPUT"
            echo 'why=в описи выпуска нет старшего номера либо Шикимори не ответил' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          lag=$(( live - have ))
          echo "lag=$lag" >> "$GITHUB_OUTPUT"
          echo "Отставание $lag номеров при пороге $LAG_LIMIT"

          # Отрицательное отставание тоже неисправность: выпуск знает номера выше
          # живого каталога — значит зеркало отвечает из кеша или отдаёт обрезок.
          if [ "$lag" -lt 0 ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo 'why=в выпуске номера старше, чем в живом каталоге: зеркало отдаёт обрезок или кеш' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$lag" -gt "$LAG_LIMIT" ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo "why=содержимое отстаёт от живого каталога на $lag номеров при допустимых $LAG_LIMIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$count" ] && [ "$count" -lt "$COUNT_FLOOR" ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo "why=в выпуске всего $count названий при поле $COUNT_FLOOR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'stale=false' >> "$GITHUB_OUTPUT"
          echo 'why=' >> "$GITHUB_OUTPUT"

      # Третий вопрос: жива ли карта MAL — AniList.
      #
      # Волна карты необязательная и свёртывается сама, когда AniList не отвечает.
      # Карта тогда наследуется из прошлого выпуска целиком, и это правильно:
      # вчерашняя карта лучше пустой. Цена в том, что унаследованная карта
      # неотличима от свежей — то же число пар, тот же размер файла. Сборка,
      # у которой AniList закрыт навсегда, выглядела бы совершенно здоровой:
      # выпуски идут, каталог свежий, а соответствий новым тайтлам нет.
      #
      # Опись уже скачана прошлым шагом, второй раз за ней не ходим.
      - name: Возраст карты
        id: map
        env:
          # Сколько карте позволено стоять. Три пропущенных понедельника:
          # одна неделя — обычный отказ AniList, две — уже подозрительно,
          # три — сломано насовсем и само не починится.
          MAP_AGE_LIMIT: '21'
        run: |
          set -euo pipefail

          if [ ! -s index.json ]; then
            echo 'Описи нет, проверка карты пропущена'
            echo 'stale=unknown' >> "$GITHUB_OUTPUT"
            echo 'days=неизвестно' >> "$GITHUB_OUTPUT"
            echo 'why=опись выпуска не скачалась' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          built="$(jq -r '.map.builtAt // empty' index.json 2>/dev/null || true)"
          count="$(jq -r '.map.count // empty' index.json 2>/dev/null || true)"
          from="$(jq -r '.map.from // empty' index.json 2>/dev/null || true)"
          wave="$(jq -r '.map.wave // empty' index.json 2>/dev/null || true)"

          # Раздела map нет — значит выпуск старого формата. Молчим и не мешаем
          # закрытию задачи: проверка сама оживёт после первого выпуска новой сборки.
          if [ -z "$built" ]; then
            echo 'В описи нет раздела карты, проверка пропущена'
            echo 'stale=unknown' >> "$GITHUB_OUTPUT"
            echo 'days=неизвестно' >> "$GITHUB_OUTPUT"
            echo 'why=опись старого формата: раздела map в ней нет' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          days=$(( ( $(date -u +%s) - $(date -u -d "$built" +%s) ) / 86400 ))
          echo "Карта: ${count:-нет} пар от выпуска ${from:-неизвестно}, собрана $built ($days дн. назад), волна ${wave:-неизвестно}"

          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "count=${count:-нет}" >> "$GITHUB_OUTPUT"
          echo "from=${from:-неизвестно}" >> "$GITHUB_OUTPUT"
          echo "wave=${wave:-неизвестно}" >> "$GITHUB_OUTPUT"
          echo "built=$built" >> "$GITHUB_OUTPUT"

          # Пустая карта — беда отдельная, и порог возраста тут ни при чём.
          # Приёмка сборки такого не выпускает, значит выпуск собран в обход неё.
          if [ -n "$count" ] && [ "$count" -eq 0 ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo 'why=карта пуста: ни одного соответствия MAL — AniList' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$days" -gt "$MAP_AGE_LIMIT" ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo "why=карта не обновлялась $days дн. при допустимых $MAP_AGE_LIMIT: волна карты не доходит до AniList" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'stale=false' >> "$GITHUB_OUTPUT"
          echo 'why=' >> "$GITHUB_OUTPUT"

      # Задача заводится одна и потом только обновляется: ежедневная проверка,
      # заводящая по задаче в сутки, превратилась бы в шум, а шум перестают читать.
      #
      # Одна задача на три причины тоже намеренно: чаще всего они приходят
      # вместе и лечатся одним и тем же действием.
      - name: Завести или обновить задачу
        if: ${{ steps.age.outputs.stale == 'true' || steps.fresh.outputs.stale == 'true' || steps.map.outputs.stale == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ steps.age.outputs.days }}
          TAG: ${{ steps.age.outputs.tag }}
          AGE_STALE: ${{ steps.age.outputs.stale }}
          FRESH_STALE: ${{ steps.fresh.outputs.stale }}
          LAG: ${{ steps.fresh.outputs.lag }}
          HAVE: ${{ steps.fresh.outputs.have }}
          LIVE: ${{ steps.fresh.outputs.live }}
          COUNT: ${{ steps.fresh.outputs.count }}
          MIRROR: ${{ steps.fresh.outputs.mirror }}
          WHY: ${{ steps.fresh.outputs.why }}
          MAP_STALE: ${{ steps.map.outputs.stale }}
          MAP_DAYS: ${{ steps.map.outputs.days }}
          MAP_COUNT: ${{ steps.map.outputs.count }}
          MAP_FROM: ${{ steps.map.outputs.from }}
          MAP_WAVE: ${{ steps.map.outputs.wave }}
          MAP_WHY: ${{ steps.map.outputs.why }}
        run: |
          set -euo pipefail

          if [ "$AGE_STALE" = 'true' ]; then
            title="Датасет: выпусков нет $DAYS дн."
          elif [ "$FRESH_STALE" = 'true' ]; then
            title="Датасет: выпуски идут, а содержимое отстаёт на $LAG номеров"
          else
            title="Датасет: карта MAL — AniList стоит $MAP_DAYS дн."
          fi

          {
            echo "Последний выпуск animori-data: **$TAG**, возраст **$DAYS дн.**"
            echo ''

            if [ "$AGE_STALE" = 'true' ]; then
              echo '## Выпуска нет'
              echo ''
              echo 'Сборка идёт по понедельникам, так что такой возраст значит,'
              echo 'что минимум один выпуск не состоялся.'
              echo ''
            fi

            if [ "$FRESH_STALE" = 'true' ]; then
              echo '## Содержимое отстаёт'
              echo ''
              echo "Причина: $WHY."
              echo ''
              echo "- в выпуске старший номер **$HAVE**, названий **$COUNT**"
              echo "- в живом каталоге **$LIVE** (спрошено у $MIRROR)"
              echo "- отставание **$LAG** номеров"
              echo ''
              echo 'Это та самая слепая зона, из-за которой проверка и заведена: выпуски'
              echo 'выходят вовремя и выглядят здоровыми, а новые тайтлы в них не попадают.'
              echo 'Смотреть надо не на дату выпуска, а в итог прогона сборки: сколько'
              echo 'страниц обошлось и на чём обход кончился.'
              echo ''
            fi

            if [ "$MAP_STALE" = 'true' ]; then
              echo '## Карта MAL — AniList стоит'
              echo ''
              echo "Причина: $MAP_WHY."
              echo ''
              echo "- в карте **$MAP_COUNT** пар, пришла из выпуска **$MAP_FROM**"
              echo "- собрана **$MAP_DAYS дн.** назад"
              echo "- волна карты в последнем прогоне: **$MAP_WAVE**"
              echo ''
              echo 'Карта наследуется из прошлого выпуска, когда волна не дошла до AniList,'
              echo 'и это правильно: вчерашняя карта лучше пустой. Но по числу пар'
              echo 'унаследованная карта неотличима от свежей, поэтому её возраст вынесен'
              echo 'в опись отдельно. Соответствий новым тайтлам в такой карте нет.'
              echo ''
              echo 'Если волна показывает **доступ закрыт** — AniList отвечает отказом'
              echo 'на запросы со стороны, и повтор прогона этого не лечит. Тогда либо'
              echo 'ждать открытия API, либо переводить сопоставление на другой источник.'
              echo ''
            fi

            echo '## Что делать'
            echo ''
            echo 'Открыть [Actions -> build-names](https://github.com/foulnike/animori-data/actions/workflows/build-names.yml)'
            echo 'и нажать **Run workflow**. Волны и публикация включены по умолчанию,'
            echo 'менять ничего не надо. Прогон идёт до полутора часов.'
            echo ''
            echo 'Ручной запуск сам по себе считается человеческой активностью и заводит'
            echo 'отсчёт шестидесяти дней заново. Если расписание успело заснуть,'
            echo 'GitHub покажет там же кнопку включения.'
            echo ''
            echo '## Если прогон упал'
            echo ''
            echo 'Причина написана в итоге прогона словами, а не только в логе шага.'
            echo 'Пороги приёмки: 25 000 названий, усадка не более 5% против прошлого'
            echo 'выпуска, старший номер не ниже прошлого и карта не меньше семени'
            echo 'на те же 5%. Не взяты — выпуска нет намеренно: половина датасета'
            echo 'хуже его отсутствия.'
            echo ''
            echo 'Клиенты в это время живут на предыдущем выпуске, а чего в нём нет —'
            echo 'спрашивают в сети по ходу. Срочности нет, но и тянуть незачем.'
            echo ''
            echo '<!-- watch-dataset -->'
          } > body.md

          # Метка в теле, а не ярлык: ярлык надо сначала завести руками,
          # и первый же прогон упал бы на его отсутствии.
          number="$(gh issue list --state open --limit 100 --json number,body \
            --jq 'map(select(.body | test("watch-dataset"))) | .[0].number // empty')"

          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file body.md
            echo "Задача #$number обновлена"
          else
            gh issue create --title "$title" --body-file body.md
          fi

      # Сам за собой убирает: выпуск вернулся — задача закрывается без человека.
      # Иначе список задач копил бы мёртвые напоминания, а их перестают читать.
      #
      # Закрываем только когда в порядке оба первых ответа. Состояние unknown
      # у свежести к закрытию не ведёт намеренно: таймаут Шикимори не должен
      # выглядеть как починка.
      #
      # У карты условие мягче — не 'true', а не строгое 'false'. Её unknown
      # означает выпуск старого формата, где раздела map нет вовсе, и строгое
      # условие держало бы задачу открытой вечно даже после настоящей починки.
      - name: Закрыть задачу, если всё в порядке
        if: ${{ steps.age.outputs.stale == 'false' && steps.fresh.outputs.stale == 'false' && steps.map.outputs.stale != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ steps.age.outputs.days }}
          TAG: ${{ steps.age.outputs.tag }}
          LAG: ${{ steps.fresh.outputs.lag }}
          MAP_DAYS: ${{ steps.map.outputs.days }}
        run: |
          set -euo pipefail

          number="$(gh issue list --state open --limit 100 --json number,body \
            --jq 'map(select(.body | test("watch-dataset"))) | .[0].number // empty')"

          if [ -z "$number" ]; then
            echo "Выпуск $TAG свежий ($DAYS дн., отставание $LAG номеров, карте $MAP_DAYS дн.), задач нет"
            exit 0
          fi

          gh issue close "$number" --comment "Выпуск $TAG на месте: возраст $DAYS дн., отставание $LAG номеров, карте $MAP_DAYS дн. Сторож закрывает сам."
